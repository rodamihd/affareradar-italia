name: AffareRadar Queue Processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: affareradar-queue-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('affareradar-queue');
            core.setSecret(token);
            core.setOutput('token', token)

      - name: Process publication queue
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://affareradar-italia.vercel.app/api/process-queue" \
            -H "Content-Type: application/json" \
            -H "x-github-oidc-token: $OIDC_TOKEN" \
            -d '{}'
