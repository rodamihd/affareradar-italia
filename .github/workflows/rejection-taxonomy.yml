name: AffareRadar Rejection Taxonomy

on:
  pull_request:
    paths:
      - "lib/rejection-reason-taxonomy.js"
      - "lib/rejection-reason-taxonomy-selftest.js"
      - "lib/decision-outcome-registry.js"
      - ".github/workflows/rejection-taxonomy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          node --check lib/rejection-reason-taxonomy.js
          node --check lib/rejection-reason-taxonomy-selftest.js
          node --check lib/decision-outcome-registry.js

      - name: Run taxonomy self-test
        run: node lib/rejection-reason-taxonomy-selftest.js

      - name: Run registry self-test
        run: node lib/decision-outcome-registry-selftest.js
