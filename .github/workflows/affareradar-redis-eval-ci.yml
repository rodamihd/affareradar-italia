name: Queue Redis EVAL integration (isolated)
on:
  pull_request:
    paths:
      - 'api/process-queue.js'
      - 'lib/queue-delivery.mjs'
      - 'lib/queue-enqueue.mjs'
      - 'lib/redis-rest.js'
      - 'api/auto-publish.js'
      - 'test/redis-rest-contract.test.mjs'
      - 'test/queue-redis-docker.test.mjs'
      - '.github/workflows/affareradar-redis-eval-ci.yml'
permissions:
  contents: read
jobs:
  redis-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable isolated Redis
        run: |
          docker run -d --network none --name affareradar-queue-redis-test redis:7-alpine
          for i in $(seq 1 20); do
            if docker exec affareradar-queue-redis-test redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify queue Lua against actual Redis (synthetic, no secrets)
        env:
          QUEUE_REDIS_INTEGRATION: '1'
        run: node --experimental-default-type=module --test test/queue-redis-docker.test.mjs
      - name: Verify Upstash REST transport contract (stubbed, no network)
        run: node --experimental-default-type=module --test test/redis-rest-contract.test.mjs
      - name: Stop disposable Redis
        if: always()
        run: docker rm -f affareradar-queue-redis-test || true
