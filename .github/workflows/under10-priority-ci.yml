name: Under-10 discovery ranking regression

on:
  pull_request:
    paths:
      - "lib/under10-priority.js"
      - "tests/under10-priority.test.mjs"
      - ".github/workflows/under10-priority-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  under10-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check (isolated, no credentials)
        run: |
          node --check lib/under10-priority.js
          node --check tests/under10-priority.test.mjs
      - name: Synthetic regression tests (no Amazon or Telegram calls)
        run: node --experimental-default-type=module --test tests/under10-priority.test.mjs
