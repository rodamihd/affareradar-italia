name: AffareRadar Discovery Fallback

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'lib/**'
      - 'vercel.json'
      - '.github/workflows/affareradar-discovery-fallback.yml'
  schedule:
    - cron: "15 6,8,10,12,14,16,18,19,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: affareradar-discovery-fallback
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('affareradar-fallback');
            core.setSecret(token);
            core.setOutput('token', token)

      - name: Check primary and trigger fallback only if needed
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST "https://affareradar-italia.vercel.app/api/discover-multisource" \
            -H "Content-Type: application/json" \
            -H "x-github-oidc-token: $OIDC_TOKEN" \
            -d '{}'
