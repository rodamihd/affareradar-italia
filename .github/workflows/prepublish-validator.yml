name: AffareRadar Pre-Publish and Storefront Safety

on:
  pull_request:
    paths:
      - "api/auto-publish.js"
      - "api/daily-top5.js"
      - "api/dashboard.js"
      - "lib/public-offer-validation.js"
      - "lib/public-offers-handler.js"
      - "lib/storefront-evidence-gate.js"
      - "lib/pre-publish-validator.js"
      - "lib/pre-publish-validator-selftest.js"
      - "tests/*.test.mjs"
      - ".github/workflows/prepublish-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check lib/pre-publish-validator.js
          node --check lib/pre-publish-validator-selftest.js
          node --check api/auto-publish.js
          node --check api/daily-top5.js
          node --check api/dashboard.js
          node --check lib/public-offer-validation.js
          node --check lib/public-offers-handler.js
          node --check lib/storefront-evidence-gate.js

      - name: Run legacy pre-publish validator
        run: node lib/pre-publish-validator-selftest.js

      - name: Run new storefront and Top 5 safety tests
        run: node --test tests/public-offers.test.mjs tests/public-offer-api.test.mjs tests/top5-eligibility.test.mjs tests/top5-handler-mock.test.mjs
